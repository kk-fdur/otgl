<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秘密のイベント館 - こきょうの占い屋</title>
    <link rel="stylesheet" href="style.css">
   </head>
<body>
    <div class="header-nav">
        <a href="../index.html" class="back-link">← メニューに戻る</a>
    </div>

    <!-- 🔒 期間外：扉が閉じている時の画面 -->
    <main id="closed-screen" class="page-shell id-screen hidden">
        <div class="closed-box">
            <div class="lock-icon">🔒</div>
            <h1>秘密のイベント館</h1>
            <p class="subtitle">現在は、静かに扉が閉じられています…</p>
            <div class="info-note">
                <p>ここはハロウィン、クリスマス、バレンタインなど、<br>特別なイベントの当日付近にだけ開く秘密の部屋です。</p>
                <p class="next-hint">✨ 次の開館をお楽しみに ✨</p>
            </div>
        </div>
    </main>

    <!-- 🔓 期間内：お祭り占い画面 -->
    <main id="open-screen" class="page-shell id-screen hidden">
        <h1 id="event-title">イベントタイトル</h1>
        <p id="event-subtitle" class="subtitle">サブタイトル</p>

        <section class="event-result-panel">
            <!-- 🌟 空いていた上の空間に「使用カード情報」を配置 -->
            <div class="event-cards-box">
                <p id="event-used-cards" class="event-used-cards-text"></p>
            </div>

            <!-- メッセージ本文（共通運勢） -->
            <div class="event-text-block">
                <h3>📜 あなたへの限定託宣</h3>
                <p id="event-content"></p>
            </div>

            <!-- 12星座の選択ボタンエリア -->
            <div class="event-text-block" style="margin-top: 30px;">
                <h3>✨ あなたの星座の特別導き</h3>
                <p class="subtitle" style="font-size: 0.9em; margin-bottom: 10px;">星座を選ぶと、この冬のラッキーアクションとアイテムが表示されます</p>
                <div class="sign-selector" id="sign-selector">
                    <!-- JavaScriptでボタンが自動生成されます -->
                </div>
            </div>

            <!-- 選んだ星座のアドバイス表示エリア -->
            <div id="personal-advice" class="personal-advice-box hidden">
                <h4 id="selected-sign-title">⏳座のあなたへ</h4>
                <p id="lucky-action" class="advice-item">🎯 ラッキーアクション: </p>
                <p id="lucky-item" class="advice-item">🔮 ラッキーアイテム: </p>
            </div>
        </section>

        <footer class="site-privacy-note">
            <p>🔒 秘密のメッセージはあなただけの端末で safe に処理されています。</p>
        </footer>
    </main>

    <script src="data.js"></script>
    <script>
        // 🛠️ 【超重要】テストしたい時は、下の「false」を「true」に書き換えると、
        // 日付に関係なく「ハロウィン占い」を強制的に画面に表示してテストできます！
        const isTestMode = false;

        function checkEvent() {
            const now = new Date();
            const currentMonth = now.getMonth() + 1; // 1月〜12月
            const currentDate = now.getDate();

            let activeEvent = null;

            // テストモードなら強制的にハロウィンにする
            if (isTestMode) {
                activeEvent = eventFortuneData.halloween;
            } else {
                // 今日がイベント期間内かどうかをループで判定
                for (let key in eventFortuneData) {
                    const ev = eventFortuneData[key];
                    if (currentMonth === ev.startMonth && currentDate >= ev.startDate && currentDate <= ev.endDate) {
                        activeEvent = ev;
                        break;
                    }
                }
            }

            // 画面の切り替え処理
            if (activeEvent) {
                // 期間内：共通データを入れて表示
                document.body.classList.add(activeEvent.themeClass);
                document.getElementById('event-title').innerText = activeEvent.title;
                document.getElementById('event-subtitle').innerText = activeEvent.subtitle;
                document.getElementById('event-content').innerText = activeEvent.commonContent || activeEvent.content;
                document.getElementById('event-used-cards').innerText = activeEvent.usedCards;
                
                // 12星座ボタンを生成
                generateSignButtons(activeEvent);

                document.getElementById('open-screen').classList.remove('hidden');
            } else {
                // 期間外：閉じている画面を表示
                document.getElementById('closed-screen').classList.remove('hidden');
            }
        }

        // 12星座ボタンを自動で並べてクリックイベントをつける関数
        function generateSignButtons(eventData) {
            const selectorContainer = document.getElementById('sign-selector');
            if (!selectorContainer || !eventData.horoscope) return;

            selectorContainer.innerHTML = '';

            for (let signKey in eventData.horoscope) {
                const signData = eventData.horoscope[signKey];
                
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'sign-btn';
                btn.innerText = signData.name;

                btn.addEventListener('click', () => {
                    document.querySelectorAll('.sign-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    document.getElementById('selected-sign-title').innerText = `✨ ${signData.name}のあなたへの導き`;
                    document.getElementById('lucky-action').innerText = `🎯 ラッキーアクション: ${signData.action}`;
                    document.getElementById('lucky-item').innerText = `🔮 ラッキーアイテム: ${signData.item}`;
                    
                    document.getElementById('personal-advice').classList.remove('hidden');
                });

                selectorContainer.appendChild(btn);
            }
        }

        // 判定を実行
        checkEvent();
    </script>
</body>
</html>
