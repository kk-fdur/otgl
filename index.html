<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タロット占い</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ecfdff;
            font-family: sans-serif;
            text-align: center;
            padding: 50px 20px;
        }

        /* 💡タロットカードの見た目（CSS） */
        .card-display {
            width: 160px;
            height: 260px;
            margin: 0 auto 30px auto;
            /* 初期状態（カードの裏面）のデザイン */
            background: linear-gradient(135deg, rgba(36, 51, 62, 0.98) 0%, rgba(17, 24, 30, 0.98) 100%);
            background-size: cover;
            background-position: center;
            border: 3px solid rgba(154, 231, 255, 0.9);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: inset 0 0 20px rgba(157, 234, 255, 0.08), 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.6s ease;
        }

        /* 占うボタン */
        .btn {
            background: #111d2e;
            color: #9ae7ff;
            border: 2px solid #9ae7ff;
            padding: 10px 30px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover {
            background: #9ae7ff;
            color: #111d2e;
        }

        /* 結果のテキスト */
        #result-text {
            margin-top: 20px;
            font-size: 1.2rem;
            min-height: 1.5em;
        }
    </style>
</head>
<body>

    <h1>本日のタロット占い</h1>

    <!-- 💡カードを表示する枠 -->
    <div id="tarot-card" class="card-display">？</div>

    <!-- 結果テキスト -->
    <div id="result-text">ボタンを押してね</div>

    <!-- 占うボタン -->
    <button class="btn" id="draw-btn">カードを引く</button>

    <!-- 💡JavaScriptで画像を切り替える処理 -->
    <script>
        // 1. タロットカードのデータ（結果の文字と、画像のファイル名）
        const tarotDeck = [
           { name: "0. 愚者 (The Fool)", image: "images/00_fool.png" },
            { name: "1. 魔術師 (The Magician)", image: "images/01_magician.png" },
            { name: "2. 女教皇 (The High Priestess)", image: "images/02_priestess.png" },
            { name: "3. 女帝 (The Empress)", image: "images/03_empress.png" },
            { name: "4. 皇帝 (The Emperor)", image: "images/04_emperor.png" },
            { name: "5. 法王 (The Hierophant)", image: "images/05_hierophant.png" },
            { name: "6. 恋人 (The Lovers)", image: "images/06_lovers.png" },
            { name: "7. 戦車 (The Chariot)", image: "images/07_chariot.png" },
            { name: "8. 力 (Strength)", image: "images/11_strength.png" },
            { name: "9. 隠者 (The Hermit)", image: "images/09_hermit.png" },
            { name: "10. 運命の輪 (Wheel of Fortune)", image: "images/10_wheel.png" }, 
            { name: "11. 正義 (The Justice)", image: "images/08_justice.png" },
            { name: "12. 吊るされた男 (The Hanged Man)", image: "images/12_hanged_man.png" },
            { name: "13. 死神 (Death)", image: "images/13_death.png" },
            { name: "14. 節制 (Temperance)", image: "images/14_temperance.png" },
            { name: "15. 悪魔 (The Devil)", image: "images/15_devil.png" },
            { name: "16. 塔 (The Tower)", image: "images/16_tower.png" },
            { name: "17. 星 (The Star)", image: "images/17_star.png" },
            { name: "18. 月 (The Moon)", image: "images/18_moon.png" },
            { name: "19. 太陽 (The Sun)", image: "images/19_sun.png" },
            { name: "20. 審判 (Judgement)", image: "images/20_judgement.png" },
            { name: "21. 世界 (The World)", image: "images/21_world.png" }
        ];

        // 2. 画面の要素（パーツ）を取得
        const cardElement = document.getElementById("tarot-card");
        const resultElement = document.getElementById("result-text");
        const buttonElement = document.getElementById("draw-btn");

        // 3. ボタンがクリックされた時の処理
        buttonElement.addEventListener("click", () => {
            // ランダムにカードを1枚選ぶ
            const randomIndex = Math.floor(Math.random() * tarotDeck.length);
            const selectedCard = tarotDeck[randomIndex];

            // 💡【重要】CSSのbackground-imageをJavaScriptから書き換える
            cardElement.style.backgroundImage = `url('${selectedCard.image}')`;
            
            // カードの中の文字を消す（画像に文字が含まれている前提）
            cardElement.textContent = ""; 
            
            // 下部のテキストを書き換える
            resultElement.textContent = `結果：${selectedCard.name}`;
        });
    </script>
</body>
</html>
