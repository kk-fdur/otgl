<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>過去ログ展示室 - こきょうの占い屋</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-nav">
        <a href="../index.html" class="back-link">← メニューに戻る</a>
    </div>

    <main class="page-shell">
        <h1 id="page-title">過去ログ展示室</h1>
        <p id="page-subtitle" class="subtitle">星と札が紡いだ、これまでの導きの軌跡</p>

        <!-- 月選択パネル -->
        <section class="setup-panel">
            <h2>閲覧したい月を選択してください</h2>
            <div style="text-align: center; margin: 16px 0;">
                <!-- 👇 新しい月が増えたら、ここに1行ずつ足していくだけ！ -->
                <select id="month-selector" onchange="loadArchiveData()" style="padding: 10px 16px; font-size: 1rem; border-radius: 8px; background: var(--bg-card, #1a2333); color: #fff; border: 1px solid rgba(155, 196, 255, 0.3); max-width: 100%; width: 280px;">
                    <option value="">-- 月を選択 --</option>
                    <option value="202610">2026年10月の運勢</option>
                    <option value="202609">2026年9月の運勢</option>
                </select>
            </div>
        </section>

        <!-- 星座選択パネル（初期状態は非表示、月を選ぶと出てくる） -->
        <section id="zodiac-panel" class="setup-panel hidden" style="margin-top: 24px;">
            <h2>星座を選択してください</h2>
            <div class="zodiac-grid">
                <button onclick="showFortune('aries')">♈ 牡羊座</button>
                <button onclick="showFortune('taurus')">♉ 牡牛座</button>
                <button onclick="showFortune('gemini')">♊ 双子座</button>
                <button onclick="showFortune('cancer')">♋ 蟹座</button>
                <button onclick="showFortune('leo')">♌ 獅子座</button>
                <button onclick="showFortune('virgo')">♍ 乙女座</button>
                <button onclick="showFortune('libra')">♎ 天秤座</button>
                <button onclick="showFortune('scorpio')">♏ 蠍座</button>
                <button onclick="showFortune('sagittarius')">♐ 射手座</button>
                <button onclick="showFortune('capricorn')">♑ 山羊座</button>
                <button onclick="showFortune('aquarius')">♒ 水瓶座</button>
                <button onclick="showFortune('pisces')">♓ 魚座</button>
            </div>
            <p id="page-used-cards" style="margin: 24px 0 0; font-size: 0.88rem; color: var(--muted); border-top: 1px dashed rgba(155, 196, 255, 0.2); padding-top: 16px; font-style: italic; line-height: 1.6; letter-spacing: 0.05em;"></p>
        </section>

        <!-- 結果表示エリア -->
        <section id="result-panel" class="result-panel hidden">
            <h2 id="zodiac-name" class="result-zodiac-title">星座名</h2>
            
            <div class="drawn-cards-box">
                <span class="box-label">🔮 当時の導きの手札</span>
                <p id="fortune-cards" class="drawn-cards-text"></p>
            </div>
            
            <div class="fortune-sections">
                <div class="fortune-block">
                    <h3>🔮 全体運</h3>
                    <p id="fortune-total"></p>
                </div>
                <div class="fortune-block">
                    <h3>💖 恋愛・対人運</h3>
                    <p id="fortune-love"></p>
                </div>
                <div class="fortune-block">
                    <h3>🌿 健康運</h3>
                    <p id="fortune-health"></p>
                </div>
                <div class="fortune-block lucky-block">
                    <h3>💎 ラッキーなものたち</h3>
                    <p id="fortune-lucky"></p>
                </div>
            </div>
        </section>

        <footer class="site-privacy-note">
            <p>🔒 閲覧履歴や選択した星座データが外部サーバーへ送信されることはありません。</p>
        </footer>
    </main>

    <script>
        // 選択された月のJSファイルを動的に読み込む関数
        function loadArchiveData() {
            const selector = document.getElementById('month-selector');
            const selectedMonth = selector.value;

            // 結果パネルと星座パネルを一旦隠す
            document.getElementById('zodiac-panel').classList.add('hidden');
            document.getElementById('result-panel').classList.add('hidden');

            if (!selectedMonth) return;

            // すでに読み込まれている古いスクリプトタグがあれば削除する
            const oldScript = document.getElementById('archive-data-script');
            if (oldScript) oldScript.remove();

            // 新しいスクリプトタグを作って、選択された月のファイルを読み込む
            // 例: valueが"202609"なら、"data_202609.js" を読み込みます
            const script = document.createElement('script');
            script.id = 'archive-data-script';
            script.src = `data_${selectedMonth}.js`;
            
            script.onload = function() {
                // ファイルが読み込まれたら、タイトルと使用カードを更新して星座パネルを出す
                if (typeof monthlyFortuneData !== 'undefined') {
                    document.getElementById('page-subtitle').innerText = monthlyFortuneData.meta.title + " のアーカイブ";
                    document.getElementById('page-used-cards').innerText = monthlyFortuneData.meta.usedCards || "";
                    document.getElementById('zodiac-panel').classList.remove('hidden');
                }
            };

            document.body.appendChild(script);
        }

        // 星座の運勢を表示する関数（今月のページとほぼ同じ）
        function showFortune(zodiacKey) {
            if (typeof monthlyFortuneData === 'undefined') return;
            const data = monthlyFortuneData[zodiacKey];
            if (!data) return;

            document.getElementById('zodiac-name').innerText = data.name;
            document.getElementById('fortune-cards').innerText = data.cards || "なし";
            document.getElementById('fortune-total').innerText = data.total;
            document.getElementById('fortune-love').innerText = data.love;
            document.getElementById('fortune-health').innerText = data.health;
            document.getElementById('fortune-lucky').innerText = data.lucky;

            const panel = document.getElementById('result-panel');
            panel.classList.remove('hidden');
            panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    </script>
</body>
</html>
