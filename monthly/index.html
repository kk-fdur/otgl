<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12星座・月間リーディング - こきょうの占い屋</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-nav">
        <a href="../index.html" class="back-link">← メニューに戻る</a>
    </div>

    <main class="page-shell">
        <h1 id="page-title">12星座・月間リーディング</h1>
        <p id="page-subtitle" class="subtitle">星と札が紡ぐ、今月の導き</p>

        <!-- 星座選択パネル -->
        <section class="setup-panel">
            <h2>あなたの星座を選択してください</h2>
            <div class="zodiac-grid" id="zodiac-grid"></div>
            
            <!-- 今回使用したカードの一覧を表示する場所 -->
            <p id="page-used-cards" style="margin: 24px 0 0; font-size: 0.88rem; color: var(--muted); border-top: 1px dashed rgba(155, 196, 255, 0.2); padding-top: 16px; font-style: italic; line-height: 1.6; letter-spacing: 0.05em;"></p>
            <!-- 👇 追加：デッキ一覧ページへの控えめなリンク -->
            <p style="margin: 12px 0 0;">
                <a href="decks.html" style="color: var(--accent); font-size: 0.88rem; text-decoration: none; border-bottom: 1px dotted var(--accent);">
                    🃏 使用しているカードデッキの写真・紹介を見る →
                </a>
            </p>
        </section>

        <!-- 結果表示エリア -->
        <section id="result-panel" class="result-panel hidden">
            <h2 id="zodiac-name" class="result-zodiac-title">星座名</h2>
            
            <!-- 引いたカードの名前を表示する枠 -->
            <div class="drawn-cards-box">
                <span class="box-label">🔮 今月の導きの手札</span>
                <p id="fortune-cards" class="drawn-cards-text"></p>
            </div>
            
            <div class="fortune-sections">
                <div class="fortune-block">
                    <h3>🔮 全体運</h3>
                    <p id="fortune-total"></p>
                </div>
                <div class="fortune-block">
                    <h3>💖 恋愛・対人運</h3>
                    <p id="fortune-love"></p>
                </div>
                <div class="fortune-block">
                    <h3>🌿 健康運</h3>
                    <p id="fortune-health"></p>
                </div>
                <div class="fortune-block lucky-block">
                    <h3>💎 ラッキーなものたち</h3>
                    <p id="fortune-lucky"></p>
                </div>
            </div>
        </section>

        <footer class="site-privacy-note">
            <p>🔒 閲覧履歴や選択した星座データが外部サーバーへ送信されることはありません。</p>
        </footer>
    </main>

    <!-- データを読み込んで処理するスクリプト -->
    <script src="data.js"></script>
    <script>
        // 12星座の基本リスト（1月＝山羊座 〜 12月＝射手座の順）
        const zodiacList = [
            { key: 'capricorn',   label: '♑ 山羊座' }, // 1月
            { key: 'aquarius',    label: '♒ 水瓶座' }, // 2月
            { key: 'pisces',      label: '♓ 魚座' },   // 3月
            { key: 'aries',       label: '♈ 牡羊座' }, // 4月
            { key: 'taurus',      label: '♉ 牡牛座' }, // 5月
            { key: 'gemini',      label: '♊ 双子座' }, // 6月
            { key: 'cancer',      label: '♋ 蟹座' },   // 7月
            { key: 'leo',         label: '♌ 獅子座' }, // 8月
            { key: 'virgo',       label: '♍ 乙女座' }, // 9月
            { key: 'libra',       label: '♎ 天秤座' }, // 10月
            { key: 'scorpio',     label: '♏ 蠍座' },   // 11月
            { key: 'sagittarius', label: '♐ 射手座' }  // 12月
        ];

        // 対象月を取得
        let targetMonth = new Date().getMonth() + 1;
        if (typeof monthlyFortuneData !== 'undefined' && monthlyFortuneData.meta) {
            const titleEl = document.getElementById('page-title');
            if (titleEl && monthlyFortuneData.meta.title) {
                titleEl.innerText = monthlyFortuneData.meta.title;
            }
            const subtitleEl = document.getElementById('page-subtitle');
            if (subtitleEl && monthlyFortuneData.meta.subtitle) {
                subtitleEl.innerText = monthlyFortuneData.meta.subtitle;
            }
            const usedCardsEl = document.getElementById('page-used-cards');
            if (usedCardsEl) {
                usedCardsEl.innerText = monthlyFortuneData.meta.usedCards || "";
            }
            
            if (monthlyFortuneData.meta.month) {
                targetMonth = Number(monthlyFortuneData.meta.month);
            }
        }

        // 対象月の星座が先頭になるように配列を並べ替える
        const startIndex = (targetMonth - 1 + 12) % 12;
        const orderedZodiacs = [
            ...zodiacList.slice(startIndex),
            ...zodiacList.slice(0, startIndex)
        ];

        // ボタンを画面に生成する
        const gridElement = document.getElementById('zodiac-grid');
        orderedZodiacs.forEach(function(zodiac, index) {
            const btn = document.createElement('button');
            btn.innerText = zodiac.label;
            if (index === 0) {
                btn.classList.add('lead-zodiac');
            }
            btn.onclick = function() {
                showFortune(zodiac.key);
            };
            gridElement.appendChild(btn);
        });

        // 星座の運勢を表示する関数
        function showFortune(zodiacKey) {
            if (typeof monthlyFortuneData === 'undefined') return;
            const data = monthlyFortuneData[zodiacKey];
            if (!data) return;

            document.getElementById('zodiac-name').innerText = data.name;
            document.getElementById('fortune-cards').innerText = data.cards || "なし";
            document.getElementById('fortune-total').innerText = data.total;
            document.getElementById('fortune-love').innerText = data.love;
            document.getElementById('fortune-health').innerText = data.health;
            document.getElementById('fortune-lucky').innerText = data.lucky;

            const panel = document.getElementById('result-panel');
            panel.classList.remove('hidden');
            panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    </script>
</body>
</html>
