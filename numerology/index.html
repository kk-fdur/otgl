<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日のお守り数秘 | こきょうの占い屋</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%230b1d2d%22 stroke=%22%237bb8d9%22 stroke-width=%224%22/><path d=%22M30 26 L38 36 Q50 32 62 36 L70 26 L68 46 Q74 62 62 78 L50 84 L38 78 Q26 62 32 46 Z%22 fill=%22%23eaf6ff%22/><circle cx=%2241%22 cy=%2249%22 r=%227.5%22 fill=%22%230b1d2d%22/><circle cx=%2259%22 cy=%2249%22 r=%227.5%22 fill=%22%230b1d2d%22/><circle cx=%2242.5%22 cy=%2247.5%22 r=%222.5%22 fill=%22%237bb8d9%22/><circle cx=%2260.5%22 cy=%2247.5%22 r=%222.5%22 fill=%22%237bb8d9%22/><polygon points=%2246,56 54,56 50,64%22 fill=%22%237bb8d9%22/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="header-nav">
    <a href="../index.html" class="back-link">← メニューに戻る</a>
  </nav>

  <h1>💠 今日のお守り数秘</h1>

  <!-- 数字のメダリオン表示 -->
  <div class="number-display" id="numberDisplay">
    <span class="number-value" id="numberValue">？</span>
    <span class="master-tag hidden" id="masterTag">ゾロ目の日</span>
  </div>

  <!-- 結果のテキストボックス -->
  <div id="result-text">
    <p id="initial-guide">ボタンを押して、今日のあなたに寄り添う小さな数字のヒントを受け取ってください。</p>

    <div id="result-content" class="hidden">
      <div class="result-card-title" id="resultTitle"></div>
      <span class="result-card-detail" id="resultDetail"></span>

      <div class="lucky-accent-box">
        <span class="lucky-item">
          お守りカラー：
          <span class="color-chip" id="colorChip"></span>
          <strong id="colorName"></strong>
        </span>
        <span class="lucky-item">
          モチーフ：<strong id="motifText"></strong>
        </span>
      </div>
    </div>
  </div>

  <!-- 占うボタン -->
  <div class="button-row">
    <button class="btn" id="drawBtn" onclick="drawNumber()">数字を引く</button>
  </div>

  <!-- プライバシーノート -->
  <div>
    <p id="result-privacy-note">※すべての処理はご使用の端末内でのみ完結し、外部へデータが送信されることはありません。</p>
  </div>

  <script src="data.js"></script>
</body>
</html>
