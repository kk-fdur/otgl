<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自分用：数秘×ホロスコープ 鑑定ツール</title>

<!-- 検索よけ・AI学習禁止対策 -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noai, noimageai">
<meta name="googlebot" content="noindex, nofollow, noarchive">

<style>
  :root {
    --bg-color: #12131a;
    --card-bg: #1c1e29;
    --accent: #d4af37;
    --accent-sub: #8a75d6;
    --text-main: #f0f0f5;
    --text-muted: #9da0b0;
    --border-color: #2f3244;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    margin: 0;
    padding: 20px;
    line-height: 1.6;
  }
  .container {
    max-width: 960px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    color: var(--accent);
    font-size: 1.5rem;
    margin-bottom: 24px;
    letter-spacing: 0.08em;
  }
  .input-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .input-row {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-end;
    justify-content: center;
  }
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .input-group label {
    font-size: 0.85rem;
    color: var(--text-muted);
  }
  .num-inputs {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  input[type="number"] {
    background: #12131a;
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 10px;
    border-radius: 6px;
    font-size: 1rem;
    text-align: center;
  }
  input.year { width: 84px; }
  input.short { width: 64px; }
  button {
    background: linear-gradient(135deg, var(--accent), #b59020);
    color: #12131a;
    font-weight: bold;
    border: none;
    padding: 11px 28px;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.9; }
  .note {
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 12px;
  }

  /* 結果エリア（2カラムで並べて表示） */
  .results-grid {
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 20px;
    display: none;
  }
  @media (max-width: 768px) {
    .results-grid { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
  }
  .panel h2 {
    margin-top: 0;
    font-size: 1.15rem;
    color: var(--accent);
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 10px;
    margin-bottom: 16px;
  }

  /* 数秘ボックス */
  .num-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .num-box {
    background: #12131a;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px 8px;
    text-align: center;
  }
  .num-box .label {
    font-size: 0.75rem;
    color: var(--text-muted);
    display: block;
  }
  .num-box .val {
    font-size: 1.8rem;
    font-weight: bold;
    color: var(--accent);
    display: block;
    margin: 4px 0;
  }
  .num-box .sub {
    font-size: 0.75rem;
    color: var(--accent-sub);
  }
  .num-detail {
    font-size: 0.9rem;
    background: #12131a;
    padding: 14px;
    border-radius: 8px;
    border-left: 3px solid var(--accent);
  }

  /* ホロスコープテーブル */
  .house-mode-badge {
    display: inline-block;
    font-size: 0.75rem;
    background: rgba(138, 117, 214, 0.2);
    color: #c2b5f5;
    padding: 3px 8px;
    border-radius: 4px;
    margin-bottom: 12px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  th, td {
    padding: 8px 6px;
    border-bottom: 1px solid var(--border-color);
    text-align: left;
  }
  th {
    color: var(--text-muted);
    font-weight: normal;
    font-size: 0.8rem;
  }
  .planet-name { font-weight: bold; }
  .house-tag {
    background: #282b3b;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.8rem;
    color: var(--accent);
  }
</style>
</head>
<body>

<div class="container">
  <h1>✦ 数秘 × ホロスコープ 鑑定盤 ✦</h1>

  <div class="input-card">
    <div class="input-row">
      <div class="input-group">
        <label>生年月日（必須）</label>
        <div class="num-inputs">
          <input type="number" id="year" class="year" placeholder="1995" min="1900" max="2100"> 年
          <input type="number" id="month" class="short" placeholder="8" min="1" max="12"> 月
          <input type="number" id="day" class="short" placeholder="15" min="1" max="31"> 日
        </div>
      </div>

      <div class="input-group">
        <label>出生時間（不明な場合は空欄でOK）</label>
        <div class="num-inputs">
          <input type="number" id="hour" class="short" placeholder="--" min="0" max="23"> 時
          <input type="number" id="minute" class="short" placeholder="--" min="0" max="59"> 分
        </div>
      </div>

      <button type="button" onclick="calculateAll()">鑑定する</button>
    </div>
    <p class="note">※出生時間あり：東京基準のハウス算出 ／ 時間不明：太陽星座を1ハウスとするソーラーハウスで算出</p>
  </div>

  <div class="results-grid" id="resultsArea">
    <!-- 左カラム：数秘術 -->
    <div class="panel">
      <h2>🔢 数秘術（ヌメロロジー）</h2>
      <div class="num-cards">
        <div class="num-box">
          <span class="label">過去数（日）</span>
          <span class="val" id="numPast">-</span>
          <span class="sub" id="numPastSub">得意・才能</span>
        </div>
        <div class="num-box">
          <span class="label">現在数（全合計）</span>
          <span class="val" id="numLife">-</span>
          <span class="sub" id="numLifeSub">本質・運命</span>
        </div>
        <div class="num-box">
          <span class="label">未来数（月＋日）</span>
          <span class="val" id="numFuture">-</span>
          <span class="sub" id="numFutureSub">目標・課題</span>
        </div>
      </div>
      <div class="num-detail" id="numMeaningArea"></div>
    </div>

    <!-- 右カラム：ホロスコープ -->
    <div class="panel">
      <h2>🌌 ホロスコープ（10天体・ハウス）</h2>
      <div id="houseModeBadge" class="house-mode-badge"></div>
      <table>
        <thead>
          <tr>
            <th>天体</th>
            <th>サイン（星座）</th>
            <th>度数</th>
            <th>ハウス</th>
          </tr>
        </thead>
        <tbody id="planetTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// 数秘のキーワードデータ（自分用に自由に書き換え可能）
const NUM_KEYWORDS = {
  1: "【1：開拓・自立】始まり、リーダーシップ、直感と行動力、独自性",
  2: "【2：協調・受容】サポート、繊細さ、バランス、共感とつながり",
  3: "【3：創造・表現】楽しさ、無邪気さ、クリエイティブ、社交性",
  4: "【4：安定・構築】誠実、ルール、基盤づくり、コツコツと形にする",
  5: "【5：自由・変化】冒険、好奇心、スピード、枠にとらわれない挑戦",
  6: "【6：愛・調和】美意識、思いやり、育てる力、責任感と奉仕",
  7: "【7：探究・哲学】分析、一人の時間、専門性、真理の追求",
  8: "【8：達成・豊かさ】情熱、エネルギー、現実的な成功、循環させる力",
  9: "【9：完成・包容】理想、癒やし、全体を見渡す視点、手放しと統合",
  11: "【11：直感・メッセンジャー】高い霊感、インスピレーション、繊細なアンテナ",
  22: "【22：カリスマ・具現化】大きなビジョンを現実に落とし込むマスタービルダー",
  33: "【33：無償の愛・奉仕】常識を超えたスケールで周囲を癒やし導く"
};

// 数秘計算（マスターナンバー11, 22, 33を保持）
function calcNumerologyNumber(num) {
  let n = num;
  while (n > 9 && n !== 11 && n !== 22 && n !== 33) {
    n = String(n).split('').reduce((acc, d) => acc + Number(d), 0);
  }
  return n;
}

// 12星座リスト
const SIGNS = [
  "牡羊座 ♈", "牡牛座 ♉", "双子座 ♊", "蟹座 ♋",
  "獅子座 ♌", "乙女座 ♍", "天秤座 ♎", "蠍座 ♏",
  "射手座 ♐", "山羊座 ♑", "水瓶座 ♒", "魚座 ♓"
];

// 角度を0〜360度に正規化
function norm360(deg) {
  let d = deg % 360;
  return d < 0 ? d + 360 : d;
}

// ユリウス日(JD)計算 (JST -> UTC変換込み)
function getJulianDay(y, m, d, h, min) {
  let utcHour = h - 9 + (min / 60);
  let date = new Date(Date.UTC(y, m - 1, d, 0, 0, 0));
  date.setTime(date.getTime() + utcHour * 3600 * 1000);
  return (date.getTime() / 86400000) + 2440587.5;
}

// 簡易天文計算による10天体の黄経算出
function calcPlanets(jd) {
  const d = jd - 2451543.5; // 2000年1月0.0日基準
  const rad = Math.PI / 180;
  const deg = 180 / Math.PI;

  function solveKepler(M, e) {
    let E = M + e * deg * Math.sin(M * rad) * (1 + e * Math.cos(M * rad));
    for (let i = 0; i < 5; i++) {
      E = E - (E - e * deg * Math.sin(E * rad) - M) / (1 - e * Math.cos(E * rad));
    }
    return E;
  }

  // 太陽
  const w_sun = norm360(282.9404 + 4.70935E-5 * d);
  const e_sun = 0.016709 - 1.151E-9 * d;
  const M_sun = norm360(356.0470 + 0.9856002585 * d);
  const E_sun = solveKepler(M_sun, e_sun);
  const xv_sun = Math.cos(E_sun * rad) - e_sun;
  const yv_sun = Math.sqrt(1 - e_sun * e_sun) * Math.sin(E_sun * rad);
  const v_sun = Math.atan2(yv_sun, xv_sun) * deg;
  const r_sun = Math.sqrt(xv_sun * xv_sun + yv_sun * yv_sun);
  const lon_sun = norm360(v_sun + w_sun);
  const xs = r_sun * Math.cos(lon_sun * rad);
  const ys = r_sun * Math.sin(lon_sun * rad);

  // 月
  const N_m = norm360(125.1228 - 0.0529538083 * d);
  const i_m = 5.1454;
  const w_m = norm360(318.0634 + 0.1643573223 * d);
  const a_m = 60.2666;
  const e_m = 0.054900;
  const M_m = norm360(115.3654 + 13.0649929509 * d);
  const E_m = solveKepler(M_m, e_m);
  const xv_m = a_m * (Math.cos(E_m * rad) - e_m);
  const yv_m = a_m * Math.sqrt(1 - e_m * e_m) * Math.sin(E_m * rad);
  const v_m = Math.atan2(yv_m, xv_m) * deg;
  const r_m = Math.sqrt(xv_m * xv_m + yv_m * yv_m);
  const xh_m = r_m * (Math.cos(N_m * rad) * Math.cos((v_m + w_m) * rad) - Math.sin(N_m * rad) * Math.sin((v_m + w_m) * rad) * Math.cos(i_m * rad));
  const yh_m = r_m * (Math.sin(N_m * rad) * Math.cos((v_m + w_m) * rad) + Math.cos(N_m * rad) * Math.sin((v_m + w_m) * rad) * Math.cos(i_m * rad));
  let lon_moon = norm360(Math.atan2(yh_m, xh_m) * deg);
  const Ls = lon_sun;
  const Lm = norm360(N_m + w_m + M_m);
  const D = norm360(Lm - Ls);
  const F = norm360(Lm - N_m);
  lon_moon = norm360(lon_moon
    - 1.274 * Math.sin((M_m - 2 * D) * rad)
    + 0.658 * Math.sin(2 * D * rad)
    - 0.186 * Math.sin(M_sun * rad)
- 0.059 * Math.sin((2 * M_m - 2 * D) * rad)
- 0.057 * Math.sin((M_m - 2 * D + M_sun) * rad)
+ 0.053 * Math.sin((M_m + 2 * D) * rad)
+ 0.046 * Math.sin((2 * D - M_sun) * rad)
+ 0.041 * Math.sin((M_m - M_sun) * rad)
- 0.035 * Math.sin(D * rad)
- 0.031 * Math.sin((M_m + M_sun) * rad)
- 0.015 * Math.sin((2 * F - 2 * D) * rad)
);
// 水星〜海王星
const elements = [
{ name: "水星 ☿", N: 48.3313 + 3.24587E-5 * d, i: 7.0047 + 5.00E-8 * d, w: 29.1241 + 1.01444E-5 * d, a: 0.387098, e: 0.205635 + 5.59E-10 * d, M: 168.6562 + 4.0923344368 * d },
{ name: "金星 ♀", N: 76.6799 + 2.46590E-5 * d, i: 3.3946 + 2.75E-8 * d, w: 54.8910 + 1.38374E-5 * d, a: 0.723330, e: 0.006773 - 1.302E-9 * d, M: 48.0052 + 1.6021302244 * d },
{ name: "火星 ♂", N: 49.5574 + 2.11081E-5 * d, i: 1.8497 - 1.78E-8 * d, w: 286.5016 + 2.92961E-5 * d, a: 1.523688, e: 0.093405 + 2.516E-9 * d, M: 18.6021 + 0.5240207766 * d },
{ name: "木星 ♃", N: 100.4542 + 2.76854E-5 * d, i: 1.3030 - 1.557E-7 * d, w: 273.8777 + 1.64505E-5 * d, a: 5.20256, e: 0.048498 + 4.469E-9 * d, M: 19.8950 + 0.0830853001 * d },
{ name: "土星 ♄", N: 113.6634 + 2.38980E-5 * d, i: 2.4886 - 1.081E-7 * d, w: 339.3939 + 2.97661E-5 * d, a: 9.55475, e: 0.055546 - 9.499E-9 * d, M: 316.9670 + 0.0334442282 * d },
{ name: "天王星 ♅", N: 74.0005 + 1.3978E-5 * d, i: 0.7733 + 1.9E-8 * d, w: 96.6612 + 3.0565E-5 * d, a: 19.18171 - 1.55E-8 * d, e: 0.047318 + 7.45E-9 * d, M: 142.5905 + 0.011725806 * d },
{ name: "海王星 ♆", N: 131.7806 + 3.0173E-5 * d, i: 1.7700 - 2.55E-7 * d, w: 272.8461 - 6.027E-6 * d, a: 30.05826 + 3.313E-8 * d, e: 0.008606 + 2.15E-9 * d, M: 260.2471 + 0.005995147 * d }
];
const results = [
{ name: "太陽 ☉", lon: lon_sun },
{ name: "月 ☽", lon: lon_moon }
];
elements.forEach(el => {
const M = norm360(el.M);
const E = solveKepler(M, el.e);
const xv = el.a * (Math.cos(E * rad) - el.e);
const yv = el.a * Math.sqrt(1 - el.e * el.e) * Math.sin(E * rad);
const v = Math.atan2(yv, xv) * deg;
const r = Math.sqrt(xv * xv + yv * yv);
const N = norm360(el.N);
const w = norm360(el.w);
const xh = r * (Math.cos(N * rad) * Math.cos((v + w) * rad) - Math.sin(N * rad) * Math.sin((v + w) * rad) * Math.cos(el.i * rad));
const yh = r * (Math.sin(N * rad) * Math.cos((v + w) * rad) + Math.cos(N * rad) * Math.sin((v + w) * rad) * Math.cos(el.i * rad));
const xg = xh + xs;
const yg = yh + ys;
results.push({ name: el.name, lon: norm360(Math.atan2(yg, xg) * deg) });
});
// 冥王星
const P = 238.95 + 0.003968789 * d;
const lon_pluto_h = 238.9508 + 0.00400703 * d
- 19.799 * Math.sin(P * rad) + 19.848 * Math.cos(P * rad)
+ 0.897 * Math.sin(2 * P * rad) - 4.956 * Math.cos(2 * P * rad)
+ 0.610 * Math.sin(3 * P * rad) + 1.211 * Math.cos(3 * P * rad);
const lat_pluto_h = -3.9082
- 5.453 * Math.sin(P * rad) - 14.975 * Math.cos(P * rad)
+ 3.527 * Math.sin(2 * P * rad) + 1.673 * Math.cos(2 * P * rad);
const r_pluto = 40.72 + 6.68 * Math.sin(P * rad) + 6.90 * Math.cos(P * rad)
- 1.18 * Math.sin(2 * P * rad) - 0.03 * Math.cos(2 * P * rad);
const xh_p = r_pluto * Math.cos(lon_pluto_h * rad) * Math.cos(lat_pluto_h * rad);
const yh_p = r_pluto * Math.sin(lon_pluto_h * rad) * Math.cos(lat_pluto_h * rad);
const lon_pluto = norm360(Math.atan2(yh_p + ys, xh_p + xs) * deg);
results.push({ name: "冥王星 ♇", lon: lon_pluto });
return results;
}
// アセンダント（ASC）の黄経を計算（東京: 東経139.7度, 北緯35.7度）
function calcAscendant(jd) {
const rad = Math.PI / 180;
const deg = 180 / Math.PI;
const T = (jd - 2451545.0) / 36525.0;
const GMST = norm360(280.46061837 + 360.98564736629 * (jd - 2451545.0) + 0.000387933 * T * T);
const LST = norm360(GMST + 139.7);
const eps = 23.439291 - 0.0130042 * T;
const y = -Math.cos(LST * rad);
const x = Math.sin(LST * rad) * Math.cos(eps * rad) + Math.tan(35.7 * rad) * Math.sin(eps * rad);
return norm360(Math.atan2(y, x) * deg);
}
// メイン実行処理
function calculateAll() {
const y = parseInt(document.getElementById('year').value, 10);
const m = parseInt(document.getElementById('month').value, 10);
const d = parseInt(document.getElementById('day').value, 10);
const hVal = document.getElementById('hour').value.trim();
const minVal = document.getElementById('minute').value.trim();
if (isNaN(y) || isNaN(m) || isNaN(d)) {
alert("生年月日（年・月・日）を入力してください。");
return;
}
// 1. 数秘術の計算
const pastNum = calcNumerologyNumber(d);
const allDigitsSum = String(y).split('').concat(String(m).split(''), String(d).split(''))
.reduce((acc, digit) => acc + Number(digit), 0);
const lifeNum = calcNumerologyNumber(allDigitsSum);
const futureNum = calcNumerologyNumber(m + d);
document.getElementById('numPast').textContent = pastNum;
document.getElementById('numLife').textContent = lifeNum;
document.getElementById('numFuture').textContent = futureNum;
document.getElementById('numMeaningArea').innerHTML = `
過去数 \({pastNum}：</strong>\){NUM_KEYWORDS[pastNum]}
現在数 \({lifeNum}：</strong>\){NUM_KEYWORDS[lifeNum]}
未来数 \({futureNum}：</strong>\){NUM_KEYWORDS[futureNum]}
`;
// 2. ホロスコープの計算
const hasTime = (hVal !== "");
const h = hasTime ? parseInt(hVal, 10) : 12;
const min = (hasTime && minVal !== "") ? parseInt(minVal, 10) : 0;
const jd = getJulianDay(y, m, d, h, min);
const planets = calcPlanets(jd);
let baseSignIndex = 0;
let badgeText = "";
if (hasTime) {
const ascLon = calcAscendant(jd);
baseSignIndex = Math.floor(ascLon / 30);
const ascDeg = (ascLon % 30).toFixed(1);
badgeText = 出生時間あり（${h}時${min}分）｜ASC：${SIGNS[baseSignIndex]} ${ascDeg}°（ホールサインハウス）;
} else {
const sunLon = planets[0].lon;
baseSignIndex = Math.floor(sunLon / 30);
badgeText = 出生時間不明（12:00計算）｜太陽星座（${SIGNS[baseSignIndex]}）を1ハウスとするソーラーサインハウス;
}
document.getElementById('houseModeBadge').textContent = badgeText;
// テーブル描画
const tbody = document.getElementById('planetTableBody');
tbody.innerHTML = "";
planets.forEach(p => {
const signIndex = Math.floor(p.lon / 30);
const degInSign = (p.lon % 30).toFixed(1);
const houseNum = ((signIndex - baseSignIndex + 12) % 12) + 1;
const tr = document.createElement('tr');
tr.innerHTML = `
${p.name}
${SIGNS[signIndex]}
${degInSign}°
第${houseNum}ハウス
`;
tbody.appendChild(tr);
});
document.getElementById('resultsArea').style.display = 'grid';
}
