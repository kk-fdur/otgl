<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自分用：数秘×ホロスコープ 鑑定ツール</title>

<!-- 検索よけ・AI学習禁止対策 -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noai, noimageai">
<meta name="googlebot" content="noindex, nofollow, noarchive">
<meta name="Google-Extended" content="noindex">
<meta name="GPTBot" content="noindex, nofollow">
<meta name="CCBot" content="noindex, nofollow">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>✦ 数秘 × ホロスコープ 鑑定盤 ✦</h1>

  <div class="input-card">
    <div class="input-row">
      <div class="input-group">
        <label>生年月日（必須）</label>
        <div class="num-inputs">
          <input type="number" id="year" class="year" placeholder="1995" min="1900" max="2100"> 年
          <input type="number" id="month" class="short" placeholder="8" min="1" max="12"> 月
          <input type="number" id="day" class="short" placeholder="15" min="1" max="31"> 日
        </div>
      </div>

      <div class="input-group">
        <label>出生時間（不明な場合は空欄でOK）</label>
        <div class="num-inputs">
          <input type="number" id="hour" class="short" placeholder="--" min="0" max="23"> 時
          <input type="number" id="minute" class="short" placeholder="--" min="0" max="59"> 分
        </div>
      </div>

      <button type="button" id="calcBtn">鑑定する</button>
    </div>
    <p class="note">※出生時間あり：東京基準のハウス算出 ／ 時間不明：太陽星座を1ハウスとするソーラーハウスで算出</p>
  </div>

  <div class="results-grid" id="resultsArea">
    <!-- 左カラム：数秘術 & 連動リーディング -->
    <div class="panel">
      <h2>🔢 数秘術 ＆ ハウス連動</h2>
      <div class="num-cards">
        <div class="num-box is-past">
          <span class="label">過去数（日）</span>
          <span class="val" id="numPast">-</span>
          <span class="sub" id="numPastHouse">第-ハウス連動</span>
        </div>
        <div class="num-box is-life">
          <span class="label">現在数（本質）</span>
          <span class="val" id="numLife">-</span>
          <span class="sub" id="numLifeHouse">第-ハウス連動</span>
        </div>
        <div class="num-box is-future">
          <span class="label">未来数（目標）</span>
          <span class="val" id="numFuture">-</span>
          <span class="sub" id="numFutureHouse">第-ハウス連動</span>
        </div>
      </div>

      <div class="num-detail" id="numMeaningArea"></div>

      <h3 class="sub-heading">✨ 数秘 × ハウス 共鳴ポイント</h3>
      <div class="sync-detail" id="syncMeaningArea"></div>
    </div>

    <!-- 右カラム：ホロスコープ盤 & 10天体表 -->
    <div class="panel">
      <h2>🌌 ホロスコープ盤（10天体・ハウス）</h2>
      <div id="houseModeBadge" class="house-mode-badge"></div>

      <!-- 円形ホロスコープSVG描画エリア -->
      <div class="chart-wrapper">
        <svg id="horoscopeChart" xmlns="http://w3.org" viewBox="0 0 420 420"></svg>
        <div class="chart-legend">
          <span><i class="dot-life"></i>現在数連動ハウス</span>
          <span><i class="dot-sub"></i>過去・未来数連動ハウス</span>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>天体</th>
            <th>サイン（星座）</th>
            <th>度数</th>
            <th>ハウス / 連動</th>
          </tr>
        </thead>
        <tbody id="planetTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
