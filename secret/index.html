<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自分用：数秘×ホロスコープ 鑑定ツール</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noai, noimageai">
<meta name="googlebot" content="noindex, nofollow, noarchive">
<meta name="Google-Extended" content="noindex">
<meta name="GPTBot" content="noindex, nofollow">
<meta name="CCBot" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>✦ 数秘 × ホロスコープ 鑑定盤 ✦</h1>

  <div class="input-card">
    <div class="input-row">
      <div class="input-group">
        <label>生年月日（必須）</label>
        <div class="num-inputs">
          <input type="number" id="year" class="year" placeholder="1995"> 年
          <input type="number" id="month" class="short" placeholder="8"> 月
          <input type="number" id="day" class="short" placeholder="15"> 日
        </div>
      </div>
      <div class="input-group">
        <label>出生時間（不明なら空欄）</label>
        <div class="num-inputs">
          <input type="number" id="hour" class="short" placeholder="--"> 時
          <input type="number" id="minute" class="short" placeholder="--"> 分
        </div>
      </div>
      <div class="input-group">
        <label>出生地（時間あり用）</label>
        <select id="birthPlace">
          <option value="35.68,139.77">東京・関東</option>
          <option value="34.69,135.50" selected>大阪・関西</option>
          <option value="43.06,141.35">札幌・北海道</option>
          <option value="38.27,140.87">仙台・東北</option>
          <option value="35.18,136.91">名古屋・東海</option>
          <option value="36.56,136.66">金沢・北陸</option>
          <option value="34.39,132.46">広島・中国</option>
          <option value="34.34,134.05">高松・四国</option>
          <option value="33.59,130.40">福岡・九州</option>
          <option value="26.21,127.68">那覇・沖縄</option>
        </select>
      </div>
      <button type="button" id="calcBtn">鑑定する</button>
    </div>
  </div>

  <div class="results-grid" id="resultsArea">
    <div class="panel">
      <h2>🔢 数秘術 ＆ ハウス連動</h2>
      <div class="num-cards">
        <div class="num-box is-past">
          <span class="label">過去数（日）</span>
          <span class="val" id="numPast">-</span>
          <span class="sub" id="numPastHouse">第-H連動</span>
        </div>
        <div class="num-box is-life">
          <span class="label">現在数（本質）</span>
          <span class="val" id="numLife">-</span>
          <span class="sub" id="numLifeHouse">第-H連動</span>
        </div>
        <div class="num-box is-future">
          <span class="label">未来数（目標）</span>
          <span class="val" id="numFuture">-</span>
          <span class="sub" id="numFutureHouse">第-H連動</span>
        </div>
      </div>
      <div class="num-detail" id="numMeaningArea"></div>
      <h3 class="sub-heading">✨ 数秘 × ハウス 共鳴ポイント</h3>
      <div class="sync-detail" id="syncMeaningArea"></div>
      <h3 class="sub-heading">🔥 星座の集中（オーバーロード）</h3>
      <div class="sync-detail" id="signFocusArea">
      </div>
    </div>

    <div class="panel">
      <h2>🌌 ホロスコープ盤（10天体・アスペクト）</h2>
      <div id="houseModeBadge" class="house-mode-badge"></div>
      <div class="chart-wrapper">
        <svg id="horoscopeChart" xmlns="http://w3.org" viewBox="0 0 420 420"></svg>
        <div class="chart-legend">
          <span><i class="dot-life"></i>現在数H</span>
          <span><i class="dot-sub"></i>過去/未来H</span>
          <span style="color:#64b5f6;">― 調和(60°/120°)</span>
          <span style="color:#ff8a80;">― 緊張/強調(0°/90°/180°)</span>
        </div>
      </div>
      <table>
        <thead>
          <tr><th>天体・役割</th><th>星座</th><th>度数</th><th>ハウス</th></tr>
        </thead>
        <tbody id="planetTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="readings.js"></script>
<script src="astro.js"></script>
<script src="app.js"></script>
</body>
</html>
