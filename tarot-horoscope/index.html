<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星札術 - タロット × 星座</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-nav">
        <a href="../index.html" class="back-link">← メニューに戻る</a>
    </div>

    <main class="page-shell">
        <h1>星札術</h1>
        <p class="subtitle">星座とタロットが紡ぐ、今日の導き</p>

        <section class="setup-panel" aria-labelledby="setup-title">
            <h2 id="setup-title">あなたの星座を選んで、カードを引きます</h2>
            <label for="zodiac-select" class="selector-label">自分の星座</label>
            <select id="zodiac-select" aria-label="星座を選択">
                <option value="0">♈ 牡羊座</option>
                <option value="1">♉ 牡牛座</option>
                <option value="2">♊ 双子座</option>
                <option value="3">♋ 蟹座</option>
                <option value="4">♌ 獅子座</option>
                <option value="5">♍ 乙女座</option>
                <option value="6">♎ 天秤座</option>
                <option value="7">♏ 蠍座</option>
                <option value="8">♐ 射手座</option>
                <option value="9">♑ 山羊座</option>
                <option value="10">♒ 水瓶座</option>
                <option value="11">♓ 魚座</option>
            </select>

            <button id="draw-btn" class="btn draw-btn" type="button">タロットをシャッフルして引く</button>
        </section>

        <!-- 【結果画面】干渉を完璧に防ぐ、2つの独立した結果ボックス構造 -->
        <section id="result-panel" class="result-panel hidden" aria-live="polite">
            
            <!-- ボックス①：タロット×星座のビジュアルエリア -->
            <div class="visual-mix-box">
                <div class="visual-mix">
                    <div class="image-box tarot-box">
                        <img id="tarot-card-image" src="" alt="引いたタロットカード">
                    </div>
                    <div class="mix-mark" aria-hidden="true">✕</div>
                    <div class="image-box zodiac-box mix-box" >
                        <div id="zodiac-image" class="zodiac-svg-container"></div>
                    </div>
                </div>
                <!-- 総合運テキスト枠を消去し、シンプルなカード名発表エリアにスッキリ変更 -->
                <p id="card-announce-text" style="text-align: center; font-weight: bold; margin-top: 1.5rem; font-size: 1.2rem;"></p>
            </div>

            <!-- ボックス②：CSSで美しく装飾される、干渉なしの独立した項目別占いエリア -->
            <div class="zodiac-fortune-box">
                <h2 class="zodiac-fortune-title">✨ 本日の項目別運勢 ✨</h2>
                <div class="fortune-details">
                    <div class="detail-item item-overall">
                        <h3>🌟 全体運</h3>
                        <p id="overall-text" class="detail-text"></p>
                    </div>
                    <div class="detail-item item-love">
                        <h3>💖 恋愛・対人運</h3>
                        <p id="love-text" class="detail-text"></p>
                    </div>
                    <div class="detail-item item-health">
                        <h3>🌿 健康運</h3>
                        <p id="health-text" class="detail-text"></p>
                    </div>
                </div>
            </div>

            <div class="button-row">
                <button id="reset-btn" class="btn reset-btn" type="button">もう一度占う</button>
            </div>
        </section>

        <footer class="site-privacy-note">
            <p>🔒 入力されたデータや占い結果は、核心部分も含めて安全に守られています。</p>
        </footer>
    </main>

    <!-- 【同じフォルダ内】のdataフォルダから安全に先行自動読み込み -->
    <script src="data/aries-data.js"></script>
    <script src="data/taurus-data.js"></script>
    <script src="data/gemini-data.js"></script>
    <script src="data/cancer-data.js"></script>
    <script src="data/leo-data.js"></script>
    <script src="data/virgo-data.js"></script>
    <script src="data/libra-data.js"></script>
    <script src="data/scorpio-data.js"></script>
    <script src="data/sagittarius-data.js"></script>
    <script src="data/capricorn-data.js"></script>
    <script src="data/aquarius-data.js"></script>
    <script src="data/pisces-data.js"></script>

    <!-- 最後にすべての司令塔であるapp.jsを読み込む -->
    <script src="app.js"></script>
</body>
</html>
