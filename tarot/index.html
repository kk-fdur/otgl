<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぷち札占い</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-nav">
        <a href="../index.html" class="back-link">← メニューに戻る</a>
    </div>

    <h1>ぷち札占い</h1>

    <!-- 💡カードを表示する枠 -->
    <div id="tarot-card" class="card-display" aria-live="polite">
        <img id="card-image" src="../images/000_taroura.png" alt="タロットカード">
    </div>

    <!-- 結果テキスト -->
    <div id="result-text">カードに尋ねたいことを思い浮かべて引くとよいでしょう</div>
    <!-- 占うボタン -->
    <div class="button-row">
        <button class="btn" id="draw-btn" type="button">カードを引く</button>
        <button class="btn hidden" id="reset-btn" type="button">もう一度引く</button>
    </div>
    <div id="result-privacy-note" class="hidden">
        🔒 入力されたデータや占い結果は、どこにも送信されず安全に守られています。
    </div>
    <script src="tarot-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
